    <!-- FontAwesome -->

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

<body class="bg-slate-900 text-slate-100 flex flex-col h-screen overflow-hidden">

            </div>
        </div>
        <div class="flex space-x-2">
            <button onclick="switchTab('map')" id="btn-map" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-amber-500 text-slate-900 transition"><i class="fa-solid fa-map mr-1"></i> Mapa</button>
            <button onclick="switchTab('list')" id="btn-list" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-700 text-slate-300 transition"><i class="fa-solid fa-list mr-1"></i> Lista</button>

            <input type="text" id="search-input" oninput="filterStations()" placeholder="Buscar por posto, rodovia ou cidade..." class="w-full bg-slate-900 border border-slate-700 rounded-lg pl-9 pr-3 py-2 text-sm text-slate-100 placeholder-slate-400 focus:outline-none focus:border-amber-500">
        </div>
        <button onclick="centerOnUser()" class="bg-slate-700 hover:bg-slate-600 text-amber-400 px-3 py-2 rounded-lg text-sm font-semibold flex items-center justify-center transition" title="Minha Localização">
            <i class="fa-solid fa-location-crosshairs text-base"></i>
        </button>
    </div>

    <!-- Conteúdo Principal: Mapa -->
    <main id="view-map" class="relative flex-1">
        <div id="map"></div>
    </main>

    <!-- Conteúdo Principal: Lista -->
    <main id="view-list" class="flex-1 overflow-y-auto p-3 hidden space-y-3">
        <!-- Lista injetada via JS -->
    </main>

        <span class="text-slate-500">Frota S10 Autorizada</span>
    </footer>

        let map, userLatLng = null, markers = {};

        document.getElementById('station-count').innerText = `${stations.length} postos cadastrados`;

        // Inicializar o Mapa
        function initMap() {
            map = L.map('map').setView([-15.7889, -49.9596], 5);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);

            renderMarkers(stations);
            renderList(stations);
            trackUserLocation();
        }

        function renderMarkers(data) {
            // Limpar antigos se houver
            Object.values(markers).forEach(m => map.removeLayer(m));
            markers = {};

            data.forEach(station => {
                const marker = L.marker([station.lat, station.lng]).addTo(map);
                marker.bindPopup(`
                    <div class="p-1 text-slate-900">
                        <h3 class="font-bold text-sm">${station.name}</h3>
                        <p class="text-xs text-slate-600 mb-2">${station.highway} ${station.desc}</p>
                        <div class="flex gap-2">
                            <a href="https://www.waze.com/ul?ll=${station.lat},${station.lng}&navigate=yes" target="_blank" class="bg-blue-600 text-white px-2 py-1 rounded text-xs font-semibold"><i class="fa-brands fa-waze"></i> Waze</a>
                            <a href="https://www.google.com/maps/dir/?api=1&destination=${station.lat},${station.lng}" target="_blank" class="bg-emerald-600 text-white px-2 py-1 rounded text-xs font-semibold"><i class="fa-solid fa-map-location-dot"></i> Maps</a>
                        </div>
                    </div>
                `);
                markers[station.id] = marker;
            });
        }

        function renderList(data) {
            const listEl = document.getElementById('view-list');
            listEl.innerHTML = '';
            
            if(data.length === 0) {
                listEl.innerHTML = `<div class="text-center py-10 text-slate-400 text-sm">Nenhum posto encontrado.</div>`;
                return;
            }

            data.forEach(station => {
                let distText = '';
                if(userLatLng) {
                    const dist = calcDistance(userLatLng[0], userLatLng[1], station.lat, station.lng);
                    distText = `<span class="bg-amber-500/20 text-amber-400 px-2 py-0.5 rounded text-[10px] font-bold"><i class="fa-solid fa-route"></i> ${dist.toFixed(1)} km</span>`;
                }

                const card = document.createElement('div');
                card.className = "bg-slate-800 border border-slate-700 rounded-xl p-3 flex flex-col justify-between shadow";
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start">
                            <h3 class="font-bold text-sm text-slate-100">${station.name}</h3>
                            ${distText}
                        </div>
                        <p class="text-xs text-slate-400 mt-0.5">${station.highway} ${station.desc}</p>
                    </div>
                    <div class="flex gap-2 mt-3 pt-2 border-t border-slate-700/60">
                        <a href="https://www.waze.com/ul?ll=${station.lat},${station.lng}&navigate=yes" target="_blank" class="flex-1 bg-blue-600/20 hover:bg-blue-600/30 text-blue-400 border border-blue-500/30 py-1.5 rounded-lg text-xs font-semibold text-center transition"><i class="fa-brands fa-waze mr-1"></i> Waze</a>
                        <a href="https://www.google.com/maps/dir/?api=1&destination=${station.lat},${station.lng}" target="_blank" class="flex-1 bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-400 border border-emerald-500/30 py-1.5 rounded-lg text-xs font-semibold text-center transition"><i class="fa-solid fa-map-location-dot mr-1"></i> Google Maps</a>
                        <button onclick="focusOnMap(${station.lat}, ${station.lng})" class="bg-slate-700 hover:bg-slate-600 text-slate-300 px-3 py-1.5 rounded-lg text-xs font-semibold"><i class="fa-solid fa-eye"></i></button>
                    </div>
                `;
                listEl.appendChild(card);
            });
        }

        function switchTab(tab) {
            const mapBtn = document.getElementById('btn-map');
            const listBtn = document.getElementById('btn-list');
            const mapEl = document.getElementById('view-map');
            const listEl = document.getElementById('view-list');

            if(tab === 'map') {
                mapBtn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold bg-amber-500 text-slate-900 transition";
                listBtn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-700 text-slate-300 transition";
                mapEl.classList.remove('hidden');
                listEl.classList.add('hidden');
                setTimeout(() => { map.invalidateSize(); }, 200);
            } else {
                listBtn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold bg-amber-500 text-slate-900 transition";
                mapBtn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-700 text-slate-300 transition";
                listEl.classList.remove('hidden');
                mapEl.classList.add('hidden');
            }
        }

        function filterStations() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = stations.filter(s => 
                s.name.toLowerCase().includes(query) || 
                s.highway.toLowerCase().includes(query) || 
                s.desc.toLowerCase().includes(query)
            );
            renderMarkers(filtered);
            renderList(filtered);
        }

        function focusOnMap(lat, lng) {
            switchTab('map');
            map.setView([lat, lng], 14);
        }

        function trackUserLocation() {
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(position => {
                    userLatLng = [position.coords.latitude, position.coords.longitude];
                    document.getElementById('gps-status').innerHTML = `<i class="fa-solid fa-circle-check text-emerald-500 mr-1"></i> GPS Ativo`;
                    
                    // Ordenar lista por proximidade se estiver na lista
                    stations.sort((a, b) => {
                        const distA = calcDistance(userLatLng[0], userLatLng[1], a.lat, a.lng);
                        const distB = calcDistance(userLatLng[0], userLatLng[1], b.lat, b.lng);
                        return distA - distB;
                    });
                    renderList(stations);
                }, error => {
                    document.getElementById('gps-status').innerHTML = `<i class="fa-solid fa-triangle-exclamation text-amber-500 mr-1"></i> GPS Indisponível`;
                }, { enableHighAccuracy: true });
            }
        }

        function centerOnUser() {
            if(userLatLng) {
                switchTab('map');
                map.setView(userLatLng, 12);
            } else {
                alert("Aguardando sinal do GPS...");
            }
        }

        function calcDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // Raio da terra em km
            const dLat = deg2rad(lat2 - lat1);
            const dLon = deg2rad(lon2 - lon1);
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * 
                Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function deg2rad(deg) { return deg * (Math.PI/180); }

        window.onload = initMap;
    </script>
